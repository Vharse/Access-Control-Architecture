services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-access_control_db}
    volumes:
      - ./database/init_rls.sql:/docker-entrypoint-initdb.d/init_rls.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_user", "-d", "access_control_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "7010:7010"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-access_control_db}
    volumes:
      - ./jwt_public.pem:/app/jwt_public.pem:ro
    depends_on:
      db:
        condition: service_healthy
